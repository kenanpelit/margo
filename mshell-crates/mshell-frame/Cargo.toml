futures.workspace = true
libc.workspace = true
gtk4-layer-shell.workspace = true
mshell-process.workspace = true
# The root helper pkexec runs (its request vocabulary + validators).
mshell-privileged.workspace = true
notify-rust.workspace = true
mcal.workspace = true
mshell-ai.workspace = true
mshell-cache.workspace = true
mshell-clipboard.workspace = true
mshell-common.workspace = true
mshell-config.workspace = true
mshell-idle.workspace = true
mshell-plugins.workspace = true
mshell-launcher.workspace = true
mshell-matugen.workspace = true
mshell-osd.workspace = true
