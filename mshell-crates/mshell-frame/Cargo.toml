mshell-screenshot.workspace = true
mshell-services.workspace = true
mshell-translate.workspace = true
mshell-session.workspace = true
mshell-settings.workspace = true
mshell-sounds.workspace = true
mshell-utils.workspace = true
reactive_graph.workspace = true
reactive_stores.workspace = true
quick-xml = "0.39"
regex.workspace = true
relm4.workspace = true
