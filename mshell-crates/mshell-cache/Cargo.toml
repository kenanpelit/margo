[package]
name = "mshell-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MShell cache"
repository.workspace = true
license.workspace = true

[dependencies]
gtk4.workspace = true
mshell-config.workspace = true
mshell-image.workspace = true
reactive_graph.workspace = true
reactive_stores.workspace = true
relm4.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.cargo-machete]
# gtk4 is not named in the source; it is here to turn on the workspace's
# `v4_20` feature, without which `gdk::Monitor::scale` (relm4's gtk) is
# missing and `cargo build -p mshell-cache` fails on its own.
ignored = ["gtk4"]
