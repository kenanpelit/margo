[package]
name = "mshell-translate"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
description = "GTK-free translation engine for margo — key-free Google Translate by default, optional DeepL"

# Shared by the shell's Translate bar widget / menu and the Settings → Translate page.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
# Edge neural-voice TTS (speak.rs): a plain blocking WebSocket client is enough
# — the call already runs on a worker thread via spawn_blocking, same as
# translate() itself. rustls to match ureq's TLS stack (no second TLS impl).
tungstenite = { version = "0.24", default-features = false, features = [
  "handshake",
  "rustls-tls-webpki-roots",
] }
# Random hex for the ConnectionId/X-RequestId/cookie values below — a v4
# UUID's bytes are random enough for that, so no separate `rand` dependency.
uuid = { version = "1", features = ["v4"] }
