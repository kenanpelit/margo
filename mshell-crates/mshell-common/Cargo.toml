[package]
name = "mshell-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MShell common components."
repository.workspace = true
license.workspace = true

[dependencies]
gtk4.workspace = true
gtk4-layer-shell.workspace = true
gtk4-session-lock.workspace = true
futures.workspace = true
mshell-config.workspace = true
reactive_graph.workspace = true
relm4.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
wayle-notification.workspace = true
[lints]
workspace = true

[package.metadata.cargo-machete]
# gtk4 and gtk4-session-lock are not named in the source (we use relm4's
# re-export); they are here to turn on the workspace's gtk4 version features.
# Without them `cargo build -p mshell-common` fails on its own: relm4's
# widget macros can't resolve `gtk::Accessible`, and `gtk::accessible`
# (the a11y helper) is behind gtk4's `v4_10`.
ignored = ["gtk4", "gtk4-session-lock"]
