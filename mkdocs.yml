site_name: margo
site_description: >-
  A modern Wayland tiling compositor — Rust + Smithay, with a
  tag-based workflow. Daily-driver-grade. dwm/dwl-style tags,
  11-layout catalogue, niri-grade animations, embedded Rhai
  scripting, HDR scaffolding, in-compositor screencast portal.
site_url: https://kenanpelit.github.io/margo/
repo_url: https://github.com/kenanpelit/margo
repo_name: kenanpelit/margo
edit_uri: edit/main/docs/
copyright: >-
  GPL-3.0-or-later. Built on
  <a href="https://github.com/Smithay/smithay">Smithay</a>.

docs_dir: docs

# docs/README.md is the contributor-facing "what's in this folder"
# index that GitHub auto-renders when someone browses /docs/. The
# site has its own index.md as the landing page, so README.md is
# excluded from the build, as are the agent/working notes (agents/,
# superpowers/ plans and specs) which are not user documentation.
exclude_docs: |
  README.md
  agents/
  superpowers/

# docs.yml builds with --strict, so every warning fails the build: a broken
# link or anchor, and a page that is neither in the nav nor excluded above.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  logo: assets/margo-icon.svg
  favicon: assets/margo-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Overview: index.md
  - Install: install.md
  - Features: features.md
  - Bar widgets: widgets.md
  - Configuration:
      - Overview: configuration.md
      - Full reference: config-reference.md
      - Config conventions: config-conventions.md
  - Dock (mdock): mdock.md
  - Companion tools:
      - Overview: companion-tools.md
      - mdots: mdots.md
  - Scripting: scripting.md
  - IPC protocol: ipc.md
  - Manual checklist: manual-checklist.md
  - Design notes:
      - HDR + colour management: hdr-design.md
      - Built-in portal: portal-design.md
      - Scripting engine: scripting-design.md
      - Cross-distro installer: install-script.md
      - Wayland protocol comparison: protocol-comparison.md
      - Wayland protocol matrix: protocol-matrix.md
      - WASM plugins: mplugins-wasm-design.md
      - Community plugins review: community-plugins-review.md
      - Code-quality roadmap: code-quality-roadmap.md
  - Roadmap: roadmap.md
  - 1.0 readiness: 1.0-readiness.md
  - Changelog:
      - Changelog: changelog.md
      - v1.0.1 release notes: release-notes/v1.0.1.md
      - v1.0.0 release notes: release-notes/v1.0.0.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Snippets are pulled relative to the repo root so we can
      # include the actual config.example.conf rather than keeping a
      # mirror in docs/.
      base_path:
        - "."
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 3
      # GitHub-style slugs preserve double dashes from `&` →  ` -- ` so
      # cross-doc anchor links from road_map.md (e.g.
      # `#3-animations--frame-clock-p2`) match the rendered
      # heading IDs. The default python-markdown slugifier collapses
      # consecutive dashes; pymdownx.slugs.slugify(case='lower')
      # mirrors GitHub's behaviour.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kenanpelit/margo
      name: kenanpelit/margo on GitHub
