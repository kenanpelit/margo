# Margo proptest soak — weekly deep fuzz of the pure algebra crates, plus a
# cargo-fuzz (libFuzzer) run over margo-config's parser and validator.
#
# The regular ci.yml runs the proptest suites at their default case
# count (256) as a smoke gate. This job re-runs the same suites at
# 200k cases (niri runs its layout-op fuzzer at the same depth in CI)
# so the long tail — the right_tile lone-master class of bug that only
# a deep run finds — surfaces on a schedule instead of on a user's
# monitor. Failures persist their seed into the committed
# *.proptest-regressions files, so a red run is reproducible locally
# with a plain `cargo test`.
#
# Only the two pure crates are soaked: margo-layouts (arrange algebra)
# and margo-config (parser + validator). Neither needs the GTK stack,
# so this runs on the plain Arch container with a minimal dep set —
# margo-config still links libxkbcommon (keysym parsing for keybinds)
# and pcre2 (window-rule regexes).
#
# Note on strategies: generate factors as integers and divide rather than
# drawing from an inclusive float range. proptest 1.11's uniform float
# sampler panics on its own invariant for a fraction of such draws, which
# at this depth is a near-certainty — it took down the very first
# scheduled run, masking a real layout bug underneath it.

name: soak

on:
  schedule:
    # Mondays 03:17 UTC — off the busy top-of-hour cron window.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      cases:
        description: "Proptest cases per property"
        required: false
        default: "200000"

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

# Read-only token: no job here writes to the repo, issues or packages.
permissions:
  contents: read

jobs:
  soak:
    # One job per crate, in parallel. They were steps of a single job until
    # 2026-07-20, when the first real scheduled run failed in margo-layouts
    # and the margo-config step never executed — a red week that told us
    # nothing about the parser. Independent jobs also mean independent
    # timeout budgets, which matters because the two are nowhere near the
    # same cost: margo-layouts finishes 200k in well under a minute,
    # margo-config takes over an hour (it parses a full config document per
    # case).
    name: soak ${{ matrix.crate }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: margo-layouts
            test: proptest_arrange
          - crate: margo-config
            test: proptest_parser

    steps:
      - name: System dependencies (pacman)
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup clang pkgconf pcre2 libxkbcommon

      - uses: actions/checkout@v7

      - name: Rust (rust-toolchain.toml pin)
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Soak ${{ matrix.crate }}
        env:
          PROPTEST_CASES: ${{ github.event.inputs.cases || '200000' }}
        run: |
          cargo test --locked -p ${{ matrix.crate }} \
            --test ${{ matrix.test }} -- --nocapture

  # Coverage-guided fuzzing of the config text front ends: the parser
  # (`parse_config_str`) and the validator behind `mctl check-config`
  # (`validate_config`), which splits lines on its own and has drifted from
  # the parser before. The targets live in fuzz/ (fuzz/README.md); ci.yml
  # keeps them compiling on stable, this runs them on nightly for 10 minutes
  # each. The seed corpus is the shipped example config without its comments,
  # cut into 16-line pieces, and inputs are capped at 4 KiB: fed the whole
  # ~95 KiB example, the sanitized validator manages ~10 runs a second; the
  # pieces cover the same code at a few hundred.
  #
  # --target is explicit: cargo-fuzz defaults to the triple it was itself
  # built for, and install-action falls back to cargo-binstall's musl build
  # of cargo-fuzz, which made it build for x86_64-unknown-linux-musl (no
  # such std in this nightly, and ASan refuses static libc).
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [parse_config_str, validate_config]

    steps:
      - name: System dependencies (pacman)
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup clang pkgconf pcre2 libxkbcommon
          rustup toolchain install nightly --profile minimal

      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz

      - name: Fuzz ${{ matrix.target }} (10 min)
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          grep -v '^[[:space:]]*#' margo/src/config.example.conf | grep -v '^[[:space:]]*$' |
            split -l 16 - fuzz/corpus/${{ matrix.target }}/example-
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- \
            -max_total_time=600 -max_len=4096

      # A crash or timeout leaves the input under fuzz/artifacts/; replay it
      # with `cargo +nightly fuzz run <target> <file>` (fuzz/README.md).
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
