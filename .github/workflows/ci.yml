# Margo CI — build / test / clippy / config-validate.
#
# Runs inside an Arch Linux container (not ubuntu-latest) on purpose:
# the GTK shell crates (mshell, mpicker, mvisual, …) use gtk4-rs 0.11
# with its `v4_20` feature, which needs GTK >= 4.20 at build time. GitHub's
# Ubuntu runners ship GTK 4.14, so a `--workspace` build can't link there. Arch always
# tracks current GTK (4.22+) and is margo's real target distro
# (CachyOS/Arch), so the whole workspace builds and the full test suite
# runs against the same library versions users get.
#
# Not covered here:
#   * scripts/smoke-winit.sh — end-to-end nested boot under Xvfb, in
#     `smoke.yml` (manual / on-demand; it needs a software GL stack).
#   * Real DRM session — impossible on GitHub-hosted runners. Manual
#     post-install validation lives in docs/manual-checklist.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The full workspace (compositor + GTK shell + mshellctl's EGL/mpv stack) is
  # large; on the ubuntu-latest host disk a debug `--workspace` build + test +
  # clippy fills the device. Drop debuginfo and incremental artifacts in CI —
  # they're the bulk of target/ and useless for a pass/fail gate.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

# Read-only token: no job here writes to the repo, issues or packages.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still going for the
# older one, instead of stacking 30-60 minute jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build / test / clippy / config (arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30

    steps:
      # Build/link deps mirror the PKGBUILD depends + makedepends:
      # smithay's native stack (wayland, libinput, libxkbcommon, libseat,
      # mesa, libdrm, libgudev, systemd-libs), the regex crate's PCRE2
      # backend, PAM/cairo/pango for mlock, and the full GTK4 + GStreamer
      # + audio stack for mshell. `rustup` installs the pinned toolchain
      # (rust-toolchain.toml) after the checkout. git is required by
      # actions/checkout inside the container.
      - name: System dependencies (pacman)
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup clang pkgconf \
            wayland wayland-protocols libinput libxkbcommon \
            mesa libdrm seatd pixman libgudev systemd-libs \
            pcre2 pam cairo pango dbus \
            mpv \
            gtk4 gtk4-layer-shell libadwaita gdk-pixbuf2 graphene fontconfig freetype2 \
            gstreamer gst-plugins-base gst-plugins-base-libs gst-plugins-good \
            alsa-lib libpulse pipewire

      - uses: actions/checkout@v5
        with:
          # Full history: the panic ratchet walks the commits since the base
          # to check every baseline raise carries its reason trailer.
          fetch-depth: 0

      # The toolchain rust-toolchain.toml pins, with the clippy and rustfmt
      # it lists. cargo uses that pin whatever the default is, so no other
      # (`stable`) toolchain is installed.
      - name: Rust (rust-toolchain.toml pin)
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Build the two PKGBUILD groups separately — NOT `--workspace`.
      # Building the compositor and the GTK/tokio shell stack in one
      # cargo invocation lets feature unification enable shell-only
      # features (tokio, zbus via mpicker → mshell-screenshot → wayle-*)
      # on the compositor's shared deps, producing a margo binary that
      # differs from what the package ships. This split mirrors the
      # PKGBUILD so CI validates the real production build configuration.
      #
      # `--locked` on every cargo invocation that resolves dependencies:
      # AUR `makepkg` builds with a frozen lockfile, so a `Cargo.toml`
      # version bump whose `Cargo.lock` was never synced must fail *here*
      # rather than in a user's `makepkg`. Without it cargo silently
      # regenerates the lock and CI goes green on a tree that cannot be
      # packaged.
      #
      # The `-p` lists come from scripts/build-groups.sh, the one list CI,
      # `just check` and the Debian/MSRV jobs share; `--check` fails when the
      # PKGBUILD's groups drift from it (install-parity.sh holds install.sh
      # to the PKGBUILD).
      - name: build groups match the PKGBUILD (gate)
        run: |
          ./scripts/build-groups.sh --check
          ./scripts/test-build-groups.sh

      - name: cargo build (compositor group)
        run: ./scripts/build-groups.sh run compositor cargo build --locked

      - name: cargo build (shell group)
        run: ./scripts/build-groups.sh run shell cargo build --locked

      - name: cargo build (mtune)
        # Built on its own in the PKGBUILD too (its GStreamer/libadwaita stack).
        run: ./scripts/build-groups.sh run mtune cargo build --locked

      - name: shell completions drift (gate)
        # contrib/completions/ is clap output checked in for packagers;
        # regenerate from the debug binaries just built and diff.
        run: ./contrib/completions/generate.sh --check target/debug

      - name: cargo test
        # Tests cover every crate; feature unification in the test build
        # doesn't ship, so `--workspace` is fine here.
        run: cargo test --workspace --locked

      - name: fuzz targets build + test (stable)
        # fuzz/ is its own workspace (cargo-fuzz needs nightly to *run* it,
        # soak.yml does that weekly), so nothing above compiles it. Check the
        # targets, test their input filter and fmt-check them here so they
        # can't rot. Not --locked: fuzz/Cargo.lock records margo-config (a
        # path dependency), whose version moves with every release; cargo
        # updates that entry and whatever margo-config newly requires, and
        # keeps every other entry as locked.
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --all-targets
          cargo test --manifest-path fuzz/Cargo.toml --lib
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: cargo fmt (gate)
        # Formatting is deterministic on the pinned toolchain
        # (rust-toolchain.toml), so this is a hard gate.
        run: cargo fmt --all -- --check

      - name: cargo clippy (gate)
        # Now gating: rust-toolchain.toml pins the toolchain, so the lint set
        # is stable and `-D warnings` won't flip red on unrelated rolling-Rust
        # drift. Bump the pin deliberately (with a clippy pass) to adopt new
        # lints. `--all-targets` so tests/examples are linted too.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: design lint (gate)
        # DESIGN.md §15 L1–L7: no hardcoded hex, no raw ≥4px
        # spacing/radius/font, --radius-widget only in bar/frame styles,
        # no literal transition durations, no Popover primary surfaces,
        # no add_css_class(""), no DragSource/DropTarget row reorder.
        run: ./scripts/design-lint.sh

      - name: panic ratchet (gate)
        # Non-test .unwrap()/.expect()/panic!() count may only go down.
        # Baseline lives in scripts/panic-baseline.txt; the script fails in
        # BOTH directions (up = regression, down = please lock the cleanup
        # in by lowering the baseline). A commit that raises the baseline
        # must carry a `PANIC-BASELINE-RAISE: <reason>` trailer
        # (scripts/panic-baseline-guard.sh), checked from the PR base or,
        # on a push, from the previous tip.
        env:
          PANIC_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./scripts/test-panic-baseline-guard.sh
          ./scripts/panic-ratchet.sh

      - name: file size (gate)
        # margo/src/state.rs (and any other file listed in
        # scripts/file-size-limits.txt) may not exceed its line limit; a
        # commit that raises a limit must carry a `FILE-SIZE-RAISE: <reason>`
        # trailer, checked from the PR base or, on a push, the previous tip.
        env:
          FILE_SIZE_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./scripts/test-file-size-gate.sh
          ./scripts/file-size-gate.sh

      - name: install.sh ⇄ PKGBUILD parity (gate)
        # install.sh's Debian path is kept by hand next to the PKGBUILD; this
        # fails when a build group, binary, unit or installed path exists in
        # one and not the other (then the self-test of the check itself).
        # test-install-arch.sh: the Arch path's makepkg call still runs
        # prepare() (no `-e`).
        run: |
          ./scripts/install-parity.sh
          ./scripts/test-install-parity.sh
          ./scripts/test-install-arch.sh
          ./scripts/optdepends-drift.sh
          ./scripts/test-optdepends-drift.sh
          ./scripts/test-install-rust.sh
          ./scripts/test-install-pkgbuild.sh

      - name: mlogind old theme-sync retirement (test)
        # The packaging helper that replaces an /etc/mlogind/variables.toml
        # the old `mlogind sync-theme` wrote, and only such a file.
        run: ./scripts/test-retire-old-sync-variables.sh

      - name: mtune de-brand (gate)
        # The mtune/ tree is a fork of an upstream GPL-3.0 GTK player; the
        # upstream project name and app-id namespace must not survive it.
        run: ./scripts/mtune-debrand-gate.sh

      - name: mctl check-config (bundled example)
        # Validates that an example user config has no diagnostics: errors,
        # and with --strict also warnings (unknown keys/rule options,
        # duplicate binds, bad values). --strict is feature-detected so this
        # step works with an mctl that predates it (then only errors fail).
        # Falls back to a minimal stub if no example is checked in.
        run: |
          if [ -f assets/example/config.conf ]; then
            CFG=assets/example/config.conf
          elif [ -f margo/src/config.example.conf ]; then
            CFG=margo/src/config.example.conf
          else
            CFG=/tmp/margo-min.conf
            cat > "$CFG" <<'EOF'
          # Minimal smoke config used by CI when no example ships.
          modkey = super
          bind = super,Return,spawn,kitty
          EOF
          fi
          STRICT=
          if ./target/debug/mctl check-config --help | grep -q -- '--strict'; then
            STRICT=--strict
          fi
          ./target/debug/mctl check-config $STRICT --config "$CFG"

  # The WASM plugin path the package ships. The PKGBUILD builds the shell with
  # `--features mshell/wasm-plugins`, which the `check` job never enables, so
  # the wasmtime host, the plugin panel renderer and mshell-frame's
  # cfg(feature = "wasm-plugins") code are built, linted and tested here —
  # against the real guest fixtures (tests/fixtures/*-guest, built for
  # wasm32-wasip2), so the host <-> guest contract (wit/world.wit) is
  # exercised end to end. MARGO_REQUIRE_WASM_FIXTURES makes a fixture that
  # failed to appear a test failure instead of a silent skip.
  wasm:
    name: wasm plugins (host + guests, arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 40
    env:
      MARGO_REQUIRE_WASM_FIXTURES: "1"
    steps:
      # Same build deps as `check`: mshell-frame links the full GTK stack.
      - name: System dependencies (pacman)
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup clang pkgconf \
            wayland wayland-protocols libinput libxkbcommon \
            mesa libdrm seatd pixman libgudev systemd-libs \
            pcre2 pam cairo pango dbus \
            mpv \
            gtk4 gtk4-layer-shell libadwaita gdk-pixbuf2 graphene fontconfig freetype2 \
            gstreamer gst-plugins-base gst-plugins-base-libs gst-plugins-good \
            alsa-lib libpulse pipewire

      - uses: actions/checkout@v5

      - name: Rust (rust-toolchain.toml pin) + wasm32-wasip2
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm

      - name: Build the guest fixtures (wasm32-wasip2)
        run: ./scripts/build-wasm-fixtures.sh

      - name: mplugin-sdk (wasm32-wasip2) + one host/guest contract
        # The authoring SDK is a standalone crate (not a workspace member)
        # that plugin authors build for wasm32-wasip2. Its wit/world.wit is a
        # symlink to the host's, so the two sides read one contract; `cmp`
        # fails if the link is ever replaced by a copy that drifts.
        run: |
          cmp mplugin-sdk/wit/world.wit mshell-crates/mshell-plugin-host/wit/world.wit
          cargo clippy --locked --target wasm32-wasip2 --manifest-path mplugin-sdk/Cargo.toml -- -D warnings
          cargo fmt --manifest-path mplugin-sdk/Cargo.toml -- --check

      - name: cargo test (plugin host, real guests)
        run: cargo test --locked -p mshell-plugin-host --features wasm

      - name: cargo test (plugin UI + frame, wasm features)
        run: >-
          cargo test --locked -p mshell-frame -p mshell-plugin-ui
          --features mshell-frame/wasm-plugins,mshell-plugin-ui/wasm

      - name: cargo clippy (wasm plugin feature, gate)
        run: >-
          cargo clippy --locked --all-targets
          -p mshell -p mshell-frame -p mshell-plugin-ui -p mshell-plugin-host
          --features mshell/wasm-plugins,mshell-plugin-ui/wasm
          -- -D warnings

  nix:
    name: Nix package and module checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        run: |
          curl --fail --location --retry 3 https://nixos.org/nix/install -o "$RUNNER_TEMP/install-nix"
          sh "$RUNNER_TEMP/install-nix" --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/nix"
          printf '%s\n' 'experimental-features = nix-command flakes' > "$HOME/.config/nix/nix.conf"
      - name: Flake checks (including NixOS module)
        run: nix flake check
      - name: Build the packaged binaries
        run: nix build

  # install.sh's Debian path on a current Debian: its apt list must carry
  # every -dev package the build needs (pkg-config probes and the -sys build
  # scripts run during `check`), on the same build groups as install.sh.
  debian:
    name: install.sh deps + check (debian sid)
    runs-on: ubuntu-latest
    container: debian:sid
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: git (for checkout)
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v5
      - name: ./install.sh deps
        run: ./install.sh deps
      - name: pkg-config probes (libs the build links that `check` doesn't)
        run: pkg-config --exists --print-errors gtk4 gtk4-layer-shell-0 libadwaita-1 mpv gstreamer-play-1.0
      - name: Rust (rust-toolchain.toml pin)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: debian
      - name: cargo check (install.sh build groups)
        # install.sh's groups = the PKGBUILD's (install-parity.sh) = these.
        run: ./scripts/build-groups.sh each cargo check --locked

  # Unused dependencies. cargo-machete is a static scan (no build), so it runs
  # on the plain runner. Only workspace members are scanned — vendor/ holds
  # verbatim upstream copies we don't trim. A false positive (a dep used under
  # its lib name, or only for its features) goes into that crate's
  # [package.metadata.cargo-machete] ignored list with a comment saying why.
  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete
      - name: cargo machete (workspace members)
        run: |
          dirs=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[].manifest_path | sub("/Cargo.toml$"; "")')
          # One directory per metadata line; preserve paths containing spaces.
          printf '%s\n' "$dirs" | while IFS= read -r dir; do
            cargo machete "$dir" || exit 1
          done

  # The declared MSRV (Cargo.toml `rust-version`) must actually build: the
  # pinned toolchain in rust-toolchain.toml is newer, so nothing else would
  # notice a newer-than-MSRV API slipping in. `check` only — codegen adds
  # nothing to the question.
  msrv:
    name: MSRV check (rust-version)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 40
    steps:
      - name: System dependencies (pacman)
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup clang pkgconf \
            wayland wayland-protocols libinput libxkbcommon \
            mesa libdrm seatd pixman libgudev systemd-libs \
            pcre2 pam cairo pango dbus \
            mpv \
            gtk4 gtk4-layer-shell libadwaita gdk-pixbuf2 graphene fontconfig freetype2 \
            gstreamer gst-plugins-base gst-plugins-base-libs gst-plugins-good \
            alsa-lib libpulse pipewire
      - uses: actions/checkout@v5
      - name: Install the MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install --profile minimal "$msrv"
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - name: cargo check on the MSRV (same groups as the build)
        run: ./scripts/build-groups.sh each cargo +"$MSRV" check --locked

  # Supply-chain scan over the vendored + git-pinned + large dependency tree
  # (the audit's "no dependency-CVE scanning" gap). Runs on the plain Ubuntu
  # runner (no GTK needed — it reads Cargo.lock). Split into a hard gate + a
  # report-only step. Config: deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Hard gate — supply-chain hygiene WE control. A dependency with a
      # disallowed license, a banned crate, or an unknown registry/git source
      # fails the build; duplicate versions are reported as warnings only
      # (deny.toml `multiple-versions = "warn"`). These only change when we
      # change deps, so they won't flip red on unrelated rolling churn.
      - name: cargo-deny (bans / licenses / sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      # Report-only — RUSTSEC advisories. Upstream advisory-db updates flag
      # transitive deps on their own schedule; a newly-published advisory
      # shouldn't block an unrelated push. Surfaced here, then triaged into
      # deny.toml's ignore list (bumped if a fix exists, parked with a note if
      # not).
      - name: cargo-deny (advisories, report-only)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          command: check advisories
