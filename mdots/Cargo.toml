[package]
name = "mdots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Kenan Pelit <kenanpelit@gmail.com>"]
description = "Declarative package + dotfiles manager for the margo desktop"
license = "GPL-3.0-or-later"
repository = "https://github.com/kenanpelit/margo"

[[bin]]
name = "mdots"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
margo-fs.workspace = true
clap = { workspace = true, features = ["cargo"] }
clap_complete = "4.5"
clap_mangen = "0.2"
serde = { version = "1.0", features = ["derive"] }
yaml_serde.workspace = true
serde_json = "1.0"
anyhow = "1.0"
sha2.workspace = true
colored = "2.1"
log = "0.4"
tracing-log = "0.2"
margo-logging = { path = "../margo-logging" }
walkdir = "2.5"
which = "7.0"
chrono = { version = "0.4", features = ["serde"] }
regex.workspace = true
hostname = "0.4"
indicatif = "0.18"
# The 0.28 default feature set (crossterm backend, underline colour) plus
# the layout cache 0.28 always had. Not the 0.30 defaults: those add the
# ratatui-macros crate and the calendar widget, which nothing here uses.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
    "underline-color",
] }
crossterm = "0.29"
tempfile = "3.8"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
dirs = "6"
