# cargo-fuzz targets. Not a workspace member (see the root Cargo.toml
# `exclude`): it needs nightly + libFuzzer, so it stays out of the normal
# build, test and clippy runs. How to run: fuzz/README.md.
[package]
name = "margo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
margo-config = { path = "../margo-config" }

# Its own workspace, so cargo does not look for (and reject) the parent one.
[workspace]
members = ["."]

[[bin]]
name = "parse_config_str"
path = "fuzz_targets/parse_config_str.rs"
test = false
doc = false
bench = false
