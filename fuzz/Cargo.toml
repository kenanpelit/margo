# cargo-fuzz targets. Not a workspace member (see the root Cargo.toml
# `exclude`): running them needs nightly + libFuzzer, so it stays out of the
# workspace build, test and clippy runs. CI checks + tests it on the pinned
# stable toolchain (ci.yml) and fuzzes it weekly on nightly (soak.yml).
# How to run: fuzz/README.md.
[package]
name = "margo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"
doc = false

[dependencies]
libfuzzer-sys = "0.4"
margo-config = { path = "../margo-config" }

# Its own workspace, so cargo does not look for (and reject) the parent one.
[workspace]
members = ["."]

[[bin]]
name = "parse_config_str"
path = "fuzz_targets/parse_config_str.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_config"
path = "fuzz_targets/validate_config.rs"
test = false
doc = false
bench = false
