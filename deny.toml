# cargo-deny — supply-chain gate for the margo workspace.
#
# Focus: RUSTSEC security advisories over the dependency tree the codebase
# never scanned — it vendors third-party code (vendor/wayle-notification,
# vendor/wayle-systray),
# pins `smithay` to a git rev, and links a large GTK + wayland + wasmtime
# stack. Non-security checks (duplicate versions, licenses) are configured
# leniently so the gate stays about vulnerabilities, not churn.
#
# CI (see ci.yml) runs this as a SPLIT gate: `bans licenses sources` is a hard
# gate (supply-chain hygiene we control — a bad license, a banned crate, or an
# unknown source fails the build; duplicate versions only WARN, see [bans]),
# while `advisories` stays
# report-only (RUSTSEC db churn flags transitive deps on its own schedule and
# shouldn't block unrelated pushes — triage those into the ignore list below).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Known, tracked exceptions — revisit when the dependency is migrated. Every
# entry carries its reason (cargo-deny prints it). Real, reachable
# vulnerabilities with an available fix are NOT parked here; they are bumped
# instead (e.g. anyhow >=1.0.103, memmap2 >=0.9.11).
#
# RUSTSEC-2026-0196 (cgmath) is gone from the tree, so it was dropped.
ignore = [
    # --- Unmaintained crates, no security vuln, no safe upgrade path ---------
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained, no vuln; only via fxprof-processed-profile in the optional, unshipped wasmtime stack" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained, no vuln; transitive via indicatif" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained proc-macro, no vuln; deep transitive and ubiquitous" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained, no vuln; build-time proc-macro via reactive_stores_macro" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no vuln; via fontdue, no maintained drop-in yet" },
    { id = "RUSTSEC-2023-0040", reason = "users unmaintained; via the pam 0.7 crate (mlogind/mlock), no maintained drop-in yet" },

    # --- Vulnerabilities with no reachable safe upgrade in our tree ----------
    { id = "RUSTSEC-2025-0040", reason = "users: root appended to group listings; no fixed release, and mlogind never uses group listings for authorization" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic duplicate-attribute check; only wayland-scanner (build time) parses our vendored, trusted protocol XML; fix in 0.41 is blocked by wayland-scanner's ^0.39 pin" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader namespace-allocation DoS; same build-time-only, trusted-input wayland-scanner path; fix blocked by the ^0.39 pin" },

    # --- wasmtime cluster: feature-gated OFF, not in the shipped binary ------
    # deny only sees these because [graph] all-features = true. Revisit when the
    # plugin runtime graduates (tracked in docs/code-quality-roadmap.md).
    { id = "RUSTSEC-2025-0046", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (fd_renumber host panic)" },
    { id = "RUSTSEC-2025-0118", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (shared linear memory API unsound)" },
    { id = "RUSTSEC-2026-0020", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (WASI resource exhaustion)" },
    { id = "RUSTSEC-2026-0021", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (wasi:http fields panic; wasi-http not used)" },
    { id = "RUSTSEC-2026-0085", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (panic lifting `flags` component value)" },
    { id = "RUSTSEC-2026-0086", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (64-bit tables + Winch data leak)" },
    { id = "RUSTSEC-2026-0087", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (f64x2.splat on Cranelift x86-64)" },
    { id = "RUSTSEC-2026-0088", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (pooling allocator data leak)" },
    { id = "RUSTSEC-2026-0089", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (Winch table.fill panic)" },
    { id = "RUSTSEC-2026-0091", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (component-model string transcoding OOB write)" },
    { id = "RUSTSEC-2026-0092", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (misaligned UTF-16 transcoding panic)" },
    { id = "RUSTSEC-2026-0093", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (UTF-16 to latin1+utf16 transcoding OOB read)" },
    { id = "RUSTSEC-2026-0094", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (Winch table.grow masking)" },
    { id = "RUSTSEC-2026-0095", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (Winch sandbox-escaping access)" },
    { id = "RUSTSEC-2026-0096", reason = "wasmtime is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (aarch64 Cranelift heap miscompile)" },
    { id = "RUSTSEC-2026-0149", reason = "wasmtime-wasi is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (path_open TRUNCATE bypasses FilePerms::WRITE)" },
    { id = "RUSTSEC-2026-0182", reason = "wasmtime-wasi is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (WASIp1 fd_renumber leak)" },
    { id = "RUSTSEC-2026-0188", reason = "wasmtime-wasi is optional behind mshell-plugin-host's off-by-default `wasm` feature and not in the shipped shell; fix needs a 27 -> 36+ major migration (hard links / renames bypass FilePerms)" },
]

[bans]
# The workspace legitimately resolves several major versions of heavy
# transitive deps (zbus via keyring, glib, windows-sys). Surface them as a
# warning rather than failing — de-duplication is a separate, non-security
# cleanup. Duplicates we cause ourselves (a member pinning its own version of
# a workspace dependency) are avoided by using `workspace = true`.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses + the workspace's own GPL-3.0. Extend as new deps
# appear, then enable the `licenses` check in ci.yml.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CC-PDDC",             # oklab — public-domain dedication
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs — TLS root cert data
    "NCSA",                # libfuzzer-sys — permissive, BSD-like (fuzz targets only)
    "Unlicense",           # ksni (mtune's StatusNotifierItem tray) — PD-equivalent
    "0BSD",
    "BSL-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
]

# evalexpr (the launcher's calculator / expression provider, pulled by
# mshell-launcher and shipped in mshell) is AGPL-3.0-only. GPLv3 §13 explicitly
# permits combining GPL-3.0 code with AGPL-3.0 code, so this is license-
# compatible with margo (GPL-3.0-or-later); the AGPL network-use clause has no
# effect on a local desktop launcher. Scoped to this single crate on purpose —
# a future AGPL dependency still trips the gate for a fresh, deliberate call.
[[licenses.exceptions]]
name = "evalexpr"
allow = ["AGPL-3.0-only"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# smithay tracks upstream HEAD (no crates.io release yet) — the single
# allowed git source. See Cargo.toml [workspace.dependencies.smithay].
allow-git = [
    "https://github.com/Smithay/smithay.git",
]
