# cargo-deny — supply-chain gate for the margo workspace.
#
# Focus: RUSTSEC security advisories over the dependency tree the codebase
# never scanned — it vendors third-party code (vendor/wayle-notification,
# vendor/wayle-systray),
# pins `smithay` to a git rev, and links a large GTK + wayland + wasmtime
# stack. Non-security checks (duplicate versions, licenses) are configured
# leniently so the gate stays about vulnerabilities, not churn.
#
# CI (see ci.yml) runs this as a SPLIT gate: `bans licenses sources` is a hard
# gate (supply-chain hygiene we control — a bad license, a banned crate, or an
# unknown source fails the build; duplicate versions only WARN, see [bans]),
# while `advisories` stays
# report-only (RUSTSEC db churn flags transitive deps on its own schedule and
# shouldn't block unrelated pushes — triage those into the ignore list below).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Known, tracked exceptions — revisit when the dependency is migrated. Every
# entry carries its reason (cargo-deny prints it). Real, reachable
# vulnerabilities with an available fix are NOT parked here; they are bumped
# instead (e.g. anyhow >=1.0.103, memmap2 >=0.9.11).
#
# RUSTSEC-2026-0196 (cgmath) is gone from the tree, so it was dropped.
ignore = [
    # --- Unmaintained crates, no security vuln, no safe upgrade path ---------
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained, no vuln; only via fxprof-processed-profile behind wasmtime's `profiling` feature, which is compiled in but only runs when a profiler is configured (mshell never does)" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained proc-macro, no vuln; deep transitive and ubiquitous" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained, no vuln; build-time proc-macro via reactive_stores_macro" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no vuln; via fontdue, no maintained drop-in yet" },
    { id = "RUSTSEC-2023-0040", reason = "users unmaintained; via the pam 0.7 crate (mlogind/mlock), no maintained drop-in yet" },
    { id = "RUSTSEC-2026-0249", reason = "smartstring unmaintained (archived), no vuln; rhai's inline string type, still a hard dependency of rhai 1.27 (latest), only parses the user's own init.rhai" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained as a standalone crate (merged into zbus 6), no vuln; the whole D-Bus stack (wayle-*, ksni, notify-rust, mpris-server, secret-service) is on zbus 5, revisit when it moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained as a standalone crate (merged into zbus 6), no vuln; same zbus 5 stack as zvariant above" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained as a standalone crate (merged into zbus 6), no vuln; proc-macro of the same zbus 5 stack" },

    # --- Vulnerabilities with no reachable safe upgrade in our tree ----------
    { id = "RUSTSEC-2025-0040", reason = "users: root appended to group listings; no fixed release, and mlogind never uses group listings for authorization" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic duplicate-attribute check; only wayland-scanner (build time) parses our vendored, trusted protocol XML; fix in 0.41 is blocked by wayland-scanner's ^0.39 pin" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader namespace-allocation DoS; same build-time-only, trusted-input wayland-scanner path; fix blocked by the ^0.39 pin" },
]

[bans]
# The workspace legitimately resolves several major versions of heavy
# transitive deps (zbus via keyring, gtk-rs system-deps, windows-sys). Surface them as a
# warning rather than failing — de-duplication is a separate, non-security
# cleanup. Duplicates we cause ourselves (a member pinning its own version of
# a workspace dependency) are avoided by using `workspace = true`.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses + the workspace's own GPL-3.0. Extend as new deps
# appear, then enable the `licenses` check in ci.yml.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CC-PDDC",             # oklab — public-domain dedication
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs — TLS root cert data
    "NCSA",                # libfuzzer-sys — permissive, BSD-like (fuzz targets only)
    "Unlicense",           # ksni (mtune's StatusNotifierItem tray) — PD-equivalent
    "0BSD",
    "BSL-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# smithay tracks upstream HEAD (no crates.io release yet) — the single
# allowed git source. See Cargo.toml [workspace.dependencies.smithay].
allow-git = [
    "https://github.com/Smithay/smithay.git",
]
