[package]
name = "mlogind"
description = "margo's TUI login / display manager (fork of lemurs)"
# Forked from lemurs (https://github.com/coastalwhite/lemurs) by
# Gijs Burghoorn, MIT OR Apache-2.0. See LICENSE-MIT / LICENSE-APACHE.
authors = [
    "Gijs Burghoorn <me@gburghoorn.com>",
    "Kenan Pelit <kenanpelit@gmail.com>",
]
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
margo-fs.workspace = true
# The greeter ⇄ runner protocol, shared with mgreet.
mlogind-proto = { path = "../mlogind-proto" }
# UI and TUI interface
# The 0.28 default feature set (crossterm backend, underline colour) plus
# the layout cache 0.28 always had. Not the 0.30 defaults: those add the
# ratatui-macros crate and the calendar widget, which nothing here uses.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
    "underline-color",
] }
crossterm = "0.29"
unicode-width = "0.2"
# Live clock on the greeter (matches mlock's centred clock).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

mio = { version = "1", features = ["os-poll", "os-ext"] }

deentry = "0.0.1"

# Interacting with the kernel interfaces
rand = "0.9"
nix = { workspace = true, features = ["fs", "poll", "signal", "time", "user"] }

# UTMPX
libc = "0.2"

# Authentication and Fetching User Data
pam = "0.7.0"
uzers = "0.11"
# Scrubs the plaintext login password from the heap on drop.
zeroize = "1.8"

# Once Cell
once_cell = "1.17.1"

# Logging
env_logger = { version = "0.10", default-features = false, features = [
    "humantime",
] }
log = "0.4.0"

# Configuration File Parsing
toml.workspace = true
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true
