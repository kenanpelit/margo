[package]
name = "mkeys"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
description = "On-screen keyboard for the margo Wayland compositor (zwp_virtual_keyboard)"

[[bin]]
name = "mkeys"
path = "src/main.rs"

[dependencies]
# GTK / relm4 — pinned to the margo workspace generation (gtk-rs 0.11 gen).
relm4 = { workspace = true }
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
gdk4 = "0.11"
# Wayland virtual keyboard
wayland-client = { workspace = true }
wayland-protocols-misc = { version = "0.3", features = ["client", "wayland-client"] }
xkbcommon = { workspace = true }
evdev = "0.13"
tempfile = "3"
# Assets + config
rust-embed = "8"
toml = { workspace = true }
serde = { workspace = true }
# CLI + logging
clap = { workspace = true }
ctrlc = "3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
