[package]
name = "margo-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parser + validator for margo's compositor .conf (key=value, window/tag/layer rules)"

[dependencies]
anyhow.workspace = true
bitflags.workspace = true
chrono.workspace = true
margo-fs.workspace = true
serde.workspace = true
tracing.workspace = true
# Rule selector patterns are checked with the same engine margo matches
# them with (W011).
regex = "1"
xkbcommon.workspace = true
# Bench-only. Optional + gated behind the `bench` feature (with
# `required-features` on the bench target) so a plain `cargo test` / `cargo
# check` cold build doesn't drag in the criterion/plotters chain. Run benches
# with `cargo bench -p margo-config --features bench`.
criterion = { version = "0.5", optional = true }

[dev-dependencies]
# Property-based parser fuzzing (tests/proptest_parser.rs).
proptest = "1"
tempfile = "3"
# Captures parser warnings in tests/warning_location.rs.
tracing-subscriber.workspace = true

[features]
bench = ["dep:criterion"]

[[bench]]
name = "parse"
harness = false
required-features = ["bench"]

[lints]
workspace = true
