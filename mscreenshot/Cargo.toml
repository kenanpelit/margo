[package]
name = "mscreenshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screenshot helper for margo — region/window/output capture with optional swappy/satty edit + clipboard."
repository.workspace = true

[[bin]]
name = "mscreenshot"
path = "src/main.rs"

[dependencies]
margo-fs.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
image.workspace = true
libc = "0.2"
margo-logging = { path = "../margo-logging" }
# `ocr --translate`: the same GTK-free engine + settings as `mshellctl translate`.
mshell-translate.workspace = true
zeroize.workspace = true

[lints]
workspace = true
